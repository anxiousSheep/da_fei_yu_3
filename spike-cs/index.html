<!doctype html><html><head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden}</style>
</head><body>
<div id="pet" style="position:absolute;width:160px;height:220px;background:#4a90e2;border-radius:16px;left:50%;top:50%;transform:translate(-50%,-50%)"></div>
<script>
function report(){
  try {
    const el = document.getElementById('pet');
    const r = el.getBoundingClientRect();
    chrome.webview.postMessage({ type:'hit', left:r.left, top:r.top, right:r.right, bottom:r.bottom, dpr:window.devicePixelRatio });
  } catch(e) { console.error('report err', e); }
}
window.addEventListener('error', function(e){ try{ chrome.webview.postMessage({type:'err', msg: e.message}); }catch(_){} });
report();
setInterval(report, 300);
</script>
</body></html>
